name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Timlog.slnx
      - name: Build
        run: dotnet build Timlog.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Timlog.slnx --configuration Release --no-build --no-restore
