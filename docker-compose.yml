services:
  api:
    build: .
    container_name: timlog_api
    ports:
      - "5076:5076"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=timlog_db;Username=postgres;Password=mysecretpassword
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Aade__BaseUrl=https://mydataapidev.aade.gr/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://timlog_aspire_dashboard:18890
    volumes:
      - keys_data:/root/.aspnet/DataProtection-Keys
    depends_on:
      - postgres
      - aspire-dashboard
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: timlog_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: timlog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: timlog_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: timlog_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    profiles:
      - tunnel

  tunnel-temp:
    image: cloudflare/cloudflared:latest
    container_name: timlog_temp_tunnel
    restart: always
    command: tunnel --url http://api:5076
    profiles:
      - temp

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: timlog_aspire_dashboard
    ports:
      - "18888:18888"
      - "18889:18889"
      - "18890:18890"
    environment:
      - DOTNET_DASHBOARD_UNAUTHENTICATED_ALLOW_ANONYMOUS=true
    restart: always

volumes:
  pgdata:
  ollama_data:
  keys_data:
